<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · HR Mehndi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8eef0; font-family: 'Inter', sans-serif; color: #2d2020; }
    .login-card { background: #fff; border-radius: 18px; border: 1px solid #e7d9d9; box-shadow: 0 18px 40px rgba(0,0,0,0.08); width: min(420px, 95vw); padding: 2.5rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; margin-bottom: 0.5rem; color: #800020; }
    p { color: #6b5555; margin-bottom: 1.75rem; line-height: 1.7; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; font-weight: 600; }
    input { width: 100%; padding: 0.95rem 1rem; border: 1px solid #d8c5c5; border-radius: 12px; font-size: 1rem; color: #2d2020; }
    input:focus { outline: none; border-color: #800020; box-shadow: 0 0 0 3px rgba(128,0,32,0.12); }
    .submit { width: 100%; margin-top: 1rem; background: #800020; color: #fff; border: none; border-radius: 12px; padding: 0.95rem 1rem; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .submit:hover { background: #5a0015; }
    .errorlist { margin-bottom: 1rem; color: #b91c1c; font-size: 0.95rem; }
    .note { margin-top: 1rem; color: #6b5555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Admin Login</h1>
    <p>Enter your admin credentials to manage booking inquiries and view the dashboard.</p>

    {% if form.errors %}
      <div class="errorlist">Please enter a valid username and password.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Username</label>
        {{ form.username }}
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="submit">Sign In</button>
    </form>

    <p class="note">Use your Django admin credentials, or create a staff user if needed.</p>
  </main>
</body>
</html>
