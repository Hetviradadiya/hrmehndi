<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Restricted · HR Mehndi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0e0609;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-pattern {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(128,0,32,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(180,130,70,0.08) 0%, transparent 50%);
    }
    .card {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(20px);
    }
    .lock-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 20px rgba(128,0,32,0.5));
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .back-link {
      display: inline-block;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .back-link:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="card">
    <span class="lock-icon">🔒</span>
    <h1>Access Restricted</h1>
    <p>This page is for HR Mehndi admin use only. You need the correct access key to view bookings.</p>
    <a href="/" class="back-link">← Back to Home</a>
  </div>
</body>
</html>
